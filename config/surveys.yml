next_features:
  title: "What should I build next for Chordly?"
  intro: "Two quick questions. Your answers help decide what I build next."
  questions:
    - key: next_feature
      type: single_choice
      prompt: "If I could build just one of these things, what would you want?"
      other: true
      options:
        sharing: "Share chord sheets/set lists between accounts (team, bandmates)"
        styling: "Style chord sheets (fonts, colours, page breaks, two-column layout)"
        accidentals: "Choose whether chords show sharps or flats when transposing"
    - key: ad_free
      type: single_choice
      prompt: "Would you pay £1.49/month ($2) to go ad-free and help fund Chordly's future?"
      options:
        "yes": "Yes"
        "maybe": "Maybe"
        "no": "No"
    - key: comments
      type: text
      optional: true
      prompt: "Anything else you'd like to see improved?"
